sonar.projectKey=system-metrics-agent
sonar.projectName=System Metrics Agent
sonar.projectVersion=1.0.0

# Code de production uniquement ; les tests sont déclarés à part
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Rapport de couverture produit par : pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8

# Le pipeline attend le verdict de la Quality Gate et échoue si elle est rouge
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300