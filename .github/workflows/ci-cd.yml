name: CI/CD — System Metrics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilège par défaut ; chaque job élargit si nécessaire.
permissions:
  contents: read

# Un nouveau push annule l'exécution précédente sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : qualité — lint, tests + couverture, SonarQube + Quality Gate
  # ---------------------------------------------------------------------------
  test:
    name: Tests & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour SonarQube)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (black + flake8)
        run: |
          black --check app tests
          flake8 app tests

      - name: Lint des Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: "Dockerfile.*"
          ignore: DL3008,DL3005

      - name: Tests + couverture XML
        run: pytest -q --cov=app --cov-report=xml --cov-report=term --junitxml=pytest-report.xml

      - name: Conserver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest-report.xml

      - name: Analyse SonarQube (+ attente de la Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # sonar.qualitygate.wait=true (dans sonar-project.properties)
        # fait échouer cette étape si la Quality Gate est rouge.

  # ---------------------------------------------------------------------------
  # Job 2 : build, scan Trivy, push Docker Hub — pour l'API et l'agent
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Image ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publication SARIF dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        component: [api, agent]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/system-metrics-${{ matrix.component }}
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        # Les secrets ne sont pas transmis aux PR venant de forks : on saute.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build local (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Taille de l'image
        run: docker image ls "${IMAGE}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rapport Trivy SARIF (non bloquant, toutes sévérités)
        if: always()
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          exit-code: "0"

      - name: Publier dans GitHub Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.component }}.cdx.json
          scan-type: image
          skip-setup-trivy: true

      - name: Archiver le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json

      - name: Scan Trivy bloquant (HIGH/CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Push Docker Hub (main uniquement, scan réussi)
        if: env.IS_RELEASE == 'true'
        run: |
          # On pousse l'image EXACTE qui vient d'être scannée (pas de rebuild).
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "Publié : ${IMAGE}:${GITHUB_SHA} et :latest" >> "$GITHUB_STEP_SUMMARY"
