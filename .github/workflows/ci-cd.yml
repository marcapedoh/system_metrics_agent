name: CI/CD — System Metrics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilège par défaut ; chaque job élargit si nécessaire.
permissions:
  contents: read

# Un nouveau push annule l'exécution précédente sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : qualité — lint, tests + couverture, SonarQube + Quality Gate
  # ---------------------------------------------------------------------------
  test:
    name: Tests & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour SonarQube)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (black + flake8)
        run: |
          black --check app tests
          flake8 app tests

      - name: Lint des Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: "Dockerfile.*"
          ignore: DL3008,DL3005

      - name: Tests + couverture XML
        run: pytest -q --cov=app --cov-report=xml --cov-report=term --junitxml=pytest-report.xml

      - name: Conserver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest-report.xml

      - name: Analyse SonarQube (+ attente de la Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # sonar.qualitygate.wait=true (dans sonar-project.properties)
        # fait échouer cette étape si la Quality Gate est rouge.

  # ---------------------------------------------------------------------------
  # Job 2 : build, scan Trivy, push Docker Hub — pour l'API et l'agent
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Image ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publication SARIF dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        component: [api, agent]
    env:
      # Nom d'utilisateur Docker Hub : variable de dépôt (pas un secret).
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'local' }}/system-metrics-${{ matrix.component }}
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Taille de l'image
        run: docker image ls "${IMAGE}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rapport Trivy SARIF (non bloquant, toutes sévérités)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          exit-code: "0"

      - name: Publier dans GitHub Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.component }}.cdx.json
          scan-type: image
          skip-setup-trivy: true

      - name: Archiver le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json

      - name: Scan Trivy bloquant (HIGH/CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Exporter l'image scannée
        # Uniquement sur main : c'est cette archive exacte qui sera publiée
        # après approbation (aucun rebuild entre le scan et le push).
        if: env.IS_RELEASE == 'true'
        run: docker save "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest" -o image-${{ matrix.component }}.tar

      - name: Archiver l'image pour la publication
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3 : PROMOTE — publication sur Docker Hub après approbation humaine
  # ---------------------------------------------------------------------------
  publish:
    name: Promote vers Docker Hub
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # L'environnement "production" impose l'approbation d'un reviewer
    # (bouton "Review deployments") et détient seul le secret DOCKERHUB_TOKEN.
    environment:
      name: production
      url: https://hub.docker.com/u/${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Vérifier la configuration
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::Variable de dépôt DOCKERHUB_USERNAME manquante."
            exit 1
          fi

      - name: Récupérer les images scannées
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true

      - name: Charger les images
        run: |
          for f in image-*.tar; do docker load -i "$f"; done
          docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push :sha et :latest
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          for component in api agent; do
            image="${NAMESPACE}/system-metrics-${component}"
            if ! docker image inspect "${image}:${GITHUB_SHA}" > /dev/null 2>&1; then
              echo "::error::${image}:${GITHUB_SHA} absente de l'archive. Le job de build a sans doute tourné avec un autre nom d'image : utilisez 'Re-run all jobs'."
              exit 1
            fi
            docker push "${image}:${GITHUB_SHA}"
            docker push "${image}:latest"
            echo "Publié : ${image}:${GITHUB_SHA} et :latest" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Commit poussé par : ${GITHUB_ACTOR}" >> "$GITHUB_STEP_SUMMARY"